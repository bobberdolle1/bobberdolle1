<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="100%" role="img" aria-label="vibecoder37">
  
    <defs>
        <linearGradient id="skyFade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#000206" />
            <stop offset="55%" stop-color="#01030a" />
            <stop offset="100%" stop-color="#020713" />
        </linearGradient>
        <radialGradient id="horizonGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#0a4a86" stop-opacity="0.55" />
            <stop offset="60%" stop-color="#062a52" stop-opacity="0.18" />
            <stop offset="100%" stop-color="#01030a" stop-opacity="0" />
        </radialGradient>
        <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="4" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <style>
            .t-title { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 300; letter-spacing: 6px; fill: #cfeeff; }
            .t-sub   { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 300; letter-spacing: 3px; fill: #4a5a70; }
            .t-mono  { font-family: "SFMono-Regular", Consolas, "Courier New", monospace; fill: #7fd4ff; }
            .t-num   { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 200; fill: #cfeeff; }
            /* No opacity here on purpose: the resting state must be a fully
               visible tower. A renderer that never advances the timeline then
               shows the field slightly low rather than showing nothing. */
            @keyframes rise { from { transform: translateY(18px); } to { transform: translateY(0); } }
            .tw { animation: rise 0.75s cubic-bezier(0.16, 0.84, 0.24, 1) both; }
            @media (prefers-reduced-motion: reduce) { .tw { animation: none; } }
        </style>
    </defs>
  <rect width="100%" height="100%" fill="url(#skyFade)" />
  <ellipse cx="500" cy="190" rx="460" ry="120" fill="url(#horizonGlow)" />
  <g opacity="0.34"><rect x="102.04" y="179.27" width="8.6" height="10.73" fill="#1d6fb8"/><rect x="193.88" y="162.88" width="8.6" height="27.12" fill="#1d6fb8"/><rect x="204.08" y="169.95" width="8.6" height="20.05" fill="#1d6fb8"/><rect x="500" y="177.69" width="8.6" height="12.31" fill="#1d6fb8"/><rect x="530.61" y="164.31" width="8.6" height="25.69" fill="#1d6fb8"/><rect x="816.33" y="165.8" width="8.6" height="24.2" fill="#1d6fb8"/><rect x="877.55" y="152" width="8.6" height="38" fill="#1d6fb8"/><rect x="959.18" y="176.31" width="8.6" height="13.69" fill="#1d6fb8"/><rect x="979.59" y="167.38" width="8.6" height="22.62" fill="#1d6fb8"/><rect x="989.8" y="177.69" width="8.6" height="12.31" fill="#1d6fb8"/></g>
  <g filter="url(#bloom)">
    <text x="500" y="80" class="t-title" font-size="46" text-anchor="middle">vibecoder37</text>
  </g>
  <text x="500" y="108" class="t-sub" font-size="11" text-anchor="middle">RF · EMBEDDED · COMPUTER VISION · RUST</text>
  <line x1="350" y1="125" x2="650" y2="125" stroke="#1d6fb8" stroke-width="0.75" opacity="0.5">
    <animate attributeName="opacity" values="0.15;0.6;0.15" dur="4s" repeatCount="indefinite"/>
  </line>
  <text x="500" y="143" class="t-sub" font-size="9.5" text-anchor="middle">IVANOVO, RU</text>
</svg>