<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="100%" role="img" aria-label="stats">
  
    <defs>
        <linearGradient id="skyFade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#000206" />
            <stop offset="55%" stop-color="#01030a" />
            <stop offset="100%" stop-color="#020713" />
        </linearGradient>
        <radialGradient id="horizonGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#0a4a86" stop-opacity="0.55" />
            <stop offset="60%" stop-color="#062a52" stop-opacity="0.18" />
            <stop offset="100%" stop-color="#01030a" stop-opacity="0" />
        </radialGradient>
        <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="4" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <style>
            .t-title { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 300; letter-spacing: 6px; fill: #cfeeff; }
            .t-sub   { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 300; letter-spacing: 3px; fill: #4a5a70; }
            .t-mono  { font-family: "SFMono-Regular", Consolas, "Courier New", monospace; fill: #7fd4ff; }
            .t-num   { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 200; fill: #cfeeff; }
            /* No opacity here on purpose: the resting state must be a fully
               visible tower. A renderer that never advances the timeline then
               shows the field slightly low rather than showing nothing. */
            @keyframes rise { from { transform: translateY(18px); } to { transform: translateY(0); } }
            .tw { animation: rise 0.75s cubic-bezier(0.16, 0.84, 0.24, 1) both; }
            @media (prefers-reduced-motion: reduce) { .tw { animation: none; } }
        </style>
    </defs>
  <rect width="100%" height="100%" fill="url(#skyFade)" />
  <line x1="46" y1="30" x2="954" y2="30" stroke="#1d6fb8" stroke-width="0.75" opacity="0.3"/>
  <text x="159.5" y="86" class="t-num" font-size="40" text-anchor="middle">1087</text>
  <text x="159.5" y="108" class="t-sub" font-size="9.5" text-anchor="middle">CONTRIBUTIONS</text>
  <text x="386.5" y="86" class="t-num" font-size="40" text-anchor="middle">54</text>
  <text x="386.5" y="108" class="t-sub" font-size="9.5" text-anchor="middle">STARS</text>
  <text x="613.5" y="86" class="t-num" font-size="40" text-anchor="middle">6</text>
  <text x="613.5" y="108" class="t-sub" font-size="9.5" text-anchor="middle">PUBLIC REPOS</text>
  <text x="840.5" y="86" class="t-num" font-size="40" text-anchor="middle">80</text>
  <text x="840.5" y="108" class="t-sub" font-size="9.5" text-anchor="middle">PEAK / DAY</text>
  <line x1="46" y1="126" x2="954" y2="126" stroke="#1d6fb8" stroke-width="0.75" opacity="0.3"/>
</svg>