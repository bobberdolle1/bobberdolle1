<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 112" width="100%" role="img" aria-label="Language composition across public repos: PYTHON 57.8%  ·  RUST 14.7%  ·  LUA 6.2%  ·  TYPESCRIPT 5.6%  ·  GO 3.4%  ·  C++ 3.1%  ·  OTHER 9.3%">
  
    <defs>
        <linearGradient id="skyFade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#000206" />
            <stop offset="55%" stop-color="#01030a" />
            <stop offset="100%" stop-color="#020713" />
        </linearGradient>
        <radialGradient id="horizonGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#0a4a86" stop-opacity="0.55" />
            <stop offset="60%" stop-color="#062a52" stop-opacity="0.18" />
            <stop offset="100%" stop-color="#01030a" stop-opacity="0" />
        </radialGradient>
        <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="4" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <style>
            .t-title { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 300; letter-spacing: 6px; fill: #cfeeff; }
            .t-sub   { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 300; letter-spacing: 3px; fill: #4a5a70; }
            .t-mono  { font-family: "SFMono-Regular", Consolas, "Courier New", monospace; fill: #7fd4ff; }
            .t-num   { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 200; fill: #cfeeff; }
            /* No opacity here on purpose: the resting state must be a fully
               visible tower. A renderer that never advances the timeline then
               shows the field slightly low rather than showing nothing. */
            @keyframes rise { from { transform: translateY(18px); } to { transform: translateY(0); } }
            .tw { animation: rise 0.75s cubic-bezier(0.16, 0.84, 0.24, 1) both; }
            @media (prefers-reduced-motion: reduce) { .tw { animation: none; } }
        </style>
    </defs>
  <defs>
    <!-- The shared bloom's ±30% region would clip the glow of a 12px-tall
         bar to ~4px; this one gives the strip real vertical headroom. -->
    <filter id="bloomBar" x="-3%" y="-300%" width="106%" height="700%">
      <feGaussianBlur stdDeviation="3.5" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#skyFade)" />
  <text x="46" y="30" class="t-sub" font-size="9.5">CODE COMPOSITION // PUBLIC SOURCE</text>
  <g filter="url(#bloomBar)"><rect x="46" y="48" width="522.72" height="12" fill="#cfeeff"/><rect x="570.72" y="48" width="131.26" height="12" fill="#aecee3"/><rect x="703.98" y="48" width="54.64" height="12" fill="#8dadc6"/><rect x="760.63" y="48" width="48.57" height="12" fill="#6d8daa"/><rect x="811.19" y="48" width="28.48" height="12" fill="#4c6d8e"/><rect x="841.67" y="48" width="25.95" height="12" fill="#2b4c71"/><rect x="869.63" y="48" width="82.37" height="12" fill="#0a1d38"/></g>
  <text x="500" y="88" class="t-sub" font-size="9.5" text-anchor="middle" style="letter-spacing:1px">PYTHON 57.8%  ·  RUST 14.7%  ·  LUA 6.2%  ·  TYPESCRIPT 5.6%  ·  GO 3.4%  ·  C++ 3.1%  ·  OTHER 9.3%</text>
</svg>